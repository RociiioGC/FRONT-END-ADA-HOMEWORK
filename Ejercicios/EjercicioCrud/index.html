<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CRUD Países</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    .flag { width: 56px; height: 36px; object-fit: cover; border:1px solid #ddd; border-radius: 4px; }
    .is-hidden { display:none !important; }
  </style>
</head>
<body>
<section class="section">
  <div class="container">
    <h1 class="title has-text-centered">Países del Mundo</h1>

    <button class="button is-primary mb-4" id="btn-abrir-crear">Crear favorito</button>

    <div class="box">
      <!-- Form -->
      <form id="form-pais" class="mb-4 is-hidden">
        <div class="field">
          <label class="label">País</label>
          <div class="control">
            <!-- Se carga desde RestCountries -->
            <div class="select is-fullwidth">
              <select id="select-pais" required></select>
            </div>
          </div>
          <p class="help">Los datos (bandera y región) se autocompletan desde RestCountries.</p>
        </div>

        <div class="field">
          <label class="label">Nota</label>
          <div class="control">
            <input class="input" type="text" id="nota" placeholder="¿Por qué lo guardas?" />
          </div>
        </div>

        <div class="field">
          <div class="columns is-vcentered">
            <div class="column is-narrow">
              <img id="preview-flag" class="flag" alt="flag preview" src="https://placehold.co/56x36?text=%E2%80%94">
            </div>
            <div class="column">
              <p class="is-size-7">
                <strong>Nombre:</strong> <span id="preview-name">—</span> ·
                <strong>Región:</strong> <span id="preview-region">—</span>
              </p>
            </div>
          </div>
        </div>

        <input type="hidden" id="id">

        <div class="field is-grouped">
          <div class="control">
            <button class="button is-success" type="submit" id="btn-guardar">Guardar</button>
          </div>
          <div class="control">
            <button class="button is-light" type="button" id="btn-cancelar">Cancelar</button>
          </div>
        </div>
      </form>

      <!-- Mensajes -->
      <div id="mensaje" class="has-text-centered"></div>

      <!-- Tabla -->
      <table class="table is-fullwidth is-striped">
        <thead>
          <tr>
            <th>País</th>
            <th>Región</th>
            <th>Bandera</th>
            <th>Nota</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-favoritos"></tbody>
      </table>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
